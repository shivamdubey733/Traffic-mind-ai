<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 96" width="50" height="96">
  <defs>
    <filter id="suv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="suv-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suv-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 4 Large Off-Road Treaded Tires -->
  <g id="suv-tires" fill="#0f172a">
    <rect x="2" y="16" width="5.5" height="17" rx="2.5"/>
    <rect x="3.5" y="19" width="3" height="11" rx="1.5" fill="#94a3b8"/>
    <rect x="42.5" y="16" width="5.5" height="17" rx="2.5"/>
    <rect x="44" y="19" width="3" height="11" rx="1.5" fill="#94a3b8"/>
    <rect x="2" y="65" width="5.5" height="17" rx="2.5"/>
    <rect x="3.5" y="68" width="3" height="11" rx="1.5" fill="#94a3b8"/>
    <rect x="42.5" y="65" width="5.5" height="17" rx="2.5"/>
    <rect x="44" y="68" width="3" height="11" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Mirrors -->
  <g fill="#334155" stroke="#0f172a" stroke-width="0.8">
    <path d="M 5 30 L -1 28 C -1.5 30 -1.5 33 -1 35 L 5 34 Z"/>
    <path d="M 45 30 L 51 28 C 51.5 30 51.5 33 51 35 L 45 34 Z"/>
  </g>

  <!-- Main SUV Body -->
  <g filter="url(#suv-shadow)">
    <!-- Chassis -->
    <path d="M 13 4 
             C 20 2, 30 2, 37 4 
             C 43 6, 45 12, 45 22 
             C 45.5 38, 45.5 58, 45 76 
             C 44 86, 41 91, 35 92 
             C 29 93, 21 93, 15 92 
             C 9 91, 6 86, 5 76 
             C 4.5 58, 4.5 38, 5 22 
             C 5 12, 7 6, 13 4 Z" 
          fill="url(#suv-body-grad)" 
          stroke="#0f172a" 
          stroke-width="1.3"/>

    <!-- Rugged Front Bumper with Skid Plate -->
    <path d="M 13 3 Q 25 1 37 3" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <rect x="17" y="5" width="16" height="4" rx="1" fill="#0f172a"/>
    <rect x="21" y="6.5" width="8" height="2" fill="#94a3b8"/>

    <!-- Dual Projector LED Headlights -->
    <rect x="7" y="6" width="6" height="5" rx="1" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="10" cy="8.5" r="1.6" fill="#38bdf8"/>
    <rect x="37" y="6" width="6" height="5" rx="1" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="40" cy="8.5" r="1.6" fill="#38bdf8"/>

    <!-- Sculpted Hood Lines -->
    <path d="M 14 9 L 15 25" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <path d="M 36 9 L 35 25" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

    <!-- Curved Windshield -->
    <path d="M 10 26 
             C 17 24, 33 24, 40 26 
             C 42 27, 42 36, 40 38 
             C 33 40, 17 40, 10 38 
             C 8 36, 8 27, 10 26 Z" 
          fill="url(#suv-glass)" 
          stroke="#0f172a" 
          stroke-width="1"/>
    <line x1="16" y1="26" x2="23" y2="32" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="27" y1="26" x2="34" y2="32" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Roof Luggage Cross Rails -->
    <line x1="11" y1="42" x2="11" y2="72" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="42" x2="11" y2="72" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="39" y1="42" x2="39" y2="72" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="39" y1="42" x2="39" y2="72" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Cross Bars -->
    <line x1="11" y1="48" x2="39" y2="48" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="11" y1="66" x2="39" y2="66" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Panoramic Sunroof -->
    <rect x="16" y="42" width="18" height="22" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="18" y1="44" x2="31" y2="58" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Side Tinted Windows -->
    <path d="M 8 31 L 11 30 L 11 67 L 8 66 Z" fill="#0f172a" opacity="0.95"/>
    <path d="M 42 31 L 39 30 L 39 67 L 42 66 Z" fill="#0f172a" opacity="0.95"/>

    <!-- Rear Window -->
    <path d="M 11 74 
             C 18 73, 32 73, 39 74 
             C 41 75, 41 83, 39 85 
             C 32 86, 18 86, 11 85 
             C 9 83, 9 75, 11 74 Z" 
          fill="url(#suv-glass)" 
          stroke="#0f172a" 
          stroke-width="1"/>

    <!-- High-Mount Third Brake Light -->
    <rect x="21" y="73.5" width="8" height="1.5" rx="0.5" fill="#ef4444"/>

    <!-- Rugged Rear Bumper -->
    <path d="M 14 89 Q 25 91 36 89" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

    <!-- Rear Taillights -->
    <rect x="6" y="78" width="4.5" height="8" rx="1.5" fill="#ef4444" stroke="#991b1b" stroke-width="0.7"/>
    <rect x="39.5" y="78" width="4.5" height="8" rx="1.5" fill="#ef4444" stroke="#991b1b" stroke-width="0.7"/>
    <rect x="7" y="82" width="2.5" height="2" fill="#f8fafc"/>
    <rect x="40.5" y="82" width="2.5" height="2" fill="#f8fafc"/>
  </g>
</svg>
