<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 104" width="52" height="104">
  <defs>
    <filter id="amb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="amb-white-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="amb-windshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="strobe-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="strobe-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- 4 Heavy Duty Rubber Tires -->
  <g id="amb-tires" fill="#0f172a">
    <rect x="2" y="18" width="5" height="16" rx="2"/>
    <rect x="3.5" y="21" width="2" height="10" rx="1" fill="#94a3b8"/>
    <rect x="45" y="18" width="5" height="16" rx="2"/>
    <rect x="46.5" y="21" width="2" height="10" rx="1" fill="#94a3b8"/>
    <rect x="2" y="74" width="5" height="16" rx="2"/>
    <rect x="3.5" y="77" width="2" height="10" rx="1" fill="#94a3b8"/>
    <rect x="45" y="74" width="5" height="16" rx="2"/>
    <rect x="46.5" y="77" width="2" height="10" rx="1" fill="#94a3b8"/>
  </g>

  <!-- Side Mirrors -->
  <g id="amb-mirrors" fill="#ffffff" stroke="#334155" stroke-width="0.8">
    <path d="M 5 32 L -1 30 C -1.5 32 -1.5 34 -1 36 L 5 35 Z"/>
    <path d="M 47 32 L 53 30 C 53.5 32 53.5 34 53 36 L 47 35 Z"/>
  </g>

  <!-- Ambulance Main Body -->
  <g filter="url(#amb-shadow)">
    <!-- Van Chassis -->
    <path d="M 13 4 
             C 20 2, 32 2, 39 4 
             C 44 6, 46 12, 46 22 
             L 46 95 
             C 46 99, 43 101, 38 101 
             L 14 101 
             C 9 101, 6 99, 6 95 
             L 6 22 
             C 6 12, 8 6, 13 4 Z" 
          fill="url(#amb-white-grad)" 
          stroke="#475569" 
          stroke-width="1.3"/>

    <!-- High-Visibility Battenburg Flank Pattern (Yellow/Green & Red reflective checks) -->
    <!-- Left Flank -->
    <rect x="6" y="38" width="3.5" height="8" fill="#84cc16"/>
    <rect x="6" y="46" width="3.5" height="8" fill="#dc2626"/>
    <rect x="6" y="54" width="3.5" height="8" fill="#84cc16"/>
    <rect x="6" y="62" width="3.5" height="8" fill="#dc2626"/>
    <rect x="6" y="70" width="3.5" height="8" fill="#84cc16"/>
    <rect x="6" y="78" width="3.5" height="8" fill="#dc2626"/>
    <rect x="6" y="86" width="3.5" height="8" fill="#84cc16"/>

    <!-- Right Flank -->
    <rect x="42.5" y="38" width="3.5" height="8" fill="#84cc16"/>
    <rect x="42.5" y="46" width="3.5" height="8" fill="#dc2626"/>
    <rect x="42.5" y="54" width="3.5" height="8" fill="#84cc16"/>
    <rect x="42.5" y="62" width="3.5" height="8" fill="#dc2626"/>
    <rect x="42.5" y="70" width="3.5" height="8" fill="#84cc16"/>
    <rect x="42.5" y="78" width="3.5" height="8" fill="#dc2626"/>
    <rect x="42.5" y="86" width="3.5" height="8" fill="#84cc16"/>

    <!-- Front Bumper & Chrome Grille -->
    <path d="M 14 3 Q 26 1 38 3" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <rect x="18" y="5" width="16" height="4" rx="1" fill="#1e293b"/>
    <line x1="20" y1="7" x2="32" y2="7" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Front Headlights with Amber Flashers -->
    <path d="M 8 6 C 10 6, 13 8, 14 12 C 11 13, 9 11, 8 8 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="11" cy="9" r="1.8" fill="#38bdf8"/>
    <path d="M 44 6 C 42 6, 39 8, 38 12 C 41 13, 43 11, 44 8 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="41" cy="9" r="1.8" fill="#38bdf8"/>

    <!-- Hood Red Cross Emblem -->
    <circle cx="26" cy="18" r="5" fill="#f8fafc" stroke="#dc2626" stroke-width="0.8"/>
    <rect x="24.5" y="14.5" width="3" height="7" fill="#dc2626"/>
    <rect x="22.5" y="16.5" width="7" height="3" fill="#dc2626"/>

    <!-- Mirrored "ECNALUBMA" text on hood -->
    <text x="26" y="25" font-size="3.2" font-family="'JetBrains Mono', monospace" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">ECNALUBMA</text>

    <!-- Curved Windshield -->
    <path d="M 11 27 
             C 18 25, 34 25, 41 27 
             C 43 28, 43 36, 41 38 
             C 34 40, 18 40, 11 38 
             C 9 36, 9 28, 11 27 Z" 
          fill="url(#amb-windshield)" 
          stroke="#0f172a" 
          stroke-width="1"/>

    <!-- Windshield Wipers -->
    <line x1="16" y1="27" x2="24" y2="31" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="28" y1="27" x2="36" y2="31" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Cab Roof Divider -->
    <rect x="10" y="39" width="32" height="2" fill="#cbd5e1"/>

    <!-- HIGH-INTENSITY EMERGENCY STROBE LIGHTBAR -->
    <rect x="12" y="38" width="28" height="5" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
    <!-- Blue Strobe (Left) -->
    <rect x="13.5" y="39" width="10" height="3" rx="1" fill="url(#strobe-blue)"/>
    <circle cx="18.5" cy="40.5" r="1.2" fill="#ffffff"/>
    <!-- Red Strobe (Right) -->
    <rect x="28.5" y="39" width="10" height="3" rx="1" fill="url(#strobe-red)"/>
    <circle cx="33.5" cy="40.5" r="1.2" fill="#ffffff"/>
    <!-- Center Amber Sync -->
    <circle cx="26" cy="40.5" r="1" fill="#facc15"/>

    <!-- ROOF MEDICAL RED CROSS -->
    <rect x="14" y="47" width="24" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="23" y="50" width="6" height="18" rx="1" fill="#dc2626"/>
    <rect x="17" y="56" width="18" height="6" rx="1" fill="#dc2626"/>

    <!-- BOLD "AMBULANCE" ROOF TEXT -->
    <rect x="12" y="74" width="28" height="10" rx="2" fill="#1e3a8a"/>
    <text x="26" y="81" font-size="4.5" font-family="'Inter', sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">AMBULANCE</text>

    <!-- Rear AC Ventilation Hatch -->
    <rect x="17" y="86" width="18" height="6" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
    <line x1="20" y1="88" x2="32" y2="88" stroke="#64748b" stroke-width="0.6"/>
    <line x1="20" y1="90" x2="32" y2="90" stroke="#64748b" stroke-width="0.6"/>

    <!-- Rear Patient Loading Doors -->
    <line x1="26" y1="94" x2="26" y2="101" stroke="#475569" stroke-width="1.2"/>
    <rect x="13" y="93" width="9" height="5" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.6"/>
    <rect x="30" y="93" width="9" height="5" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.6"/>

    <!-- Rear Chevron Safety Stripes -->
    <path d="M 8 98 L 12 101 L 8 101 Z" fill="#dc2626"/>
    <path d="M 12 98 L 16 101 L 12 101 Z" fill="#facc15"/>
    <path d="M 36 98 L 40 101 L 36 101 Z" fill="#facc15"/>
    <path d="M 40 98 L 44 101 L 40 101 Z" fill="#dc2626"/>

    <!-- Rear Emergency LED Flashers -->
    <rect x="7" y="94" width="3" height="3" rx="0.5" fill="#ef4444"/>
    <rect x="42" y="94" width="3" height="3" rx="0.5" fill="#3b82f6"/>
  </g>
</svg>
