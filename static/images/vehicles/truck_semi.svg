<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 168" width="54" height="168">
  <defs>
    <filter id="truck-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="cab-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="container-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="15%" stop-color="#64748b"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Wheels -->
  <g id="truck-wheels" fill="#0f172a">
    <!-- Cab Steer Wheels -->
    <rect x="2" y="14" width="5" height="16" rx="2"/>
    <rect x="3.5" y="17" width="2" height="10" rx="1" fill="#cbd5e1"/>
    <rect x="47" y="14" width="5" height="16" rx="2"/>
    <rect x="48.5" y="17" width="2" height="10" rx="1" fill="#cbd5e1"/>
    <!-- Trailer Dual Tandem Axles (Left & Right) -->
    <rect x="0" y="130" width="6.5" height="15" rx="2"/>
    <rect x="2" y="132" width="2.5" height="11" rx="1" fill="#94a3b8"/>
    <rect x="0" y="147" width="6.5" height="15" rx="2"/>
    <rect x="2" y="149" width="2.5" height="11" rx="1" fill="#94a3b8"/>
    <rect x="47.5" y="130" width="6.5" height="15" rx="2"/>
    <rect x="49.5" y="132" width="2.5" height="11" rx="1" fill="#94a3b8"/>
    <rect x="47.5" y="147" width="6.5" height="15" rx="2"/>
    <rect x="49.5" y="149" width="2.5" height="11" rx="1" fill="#94a3b8"/>
  </g>

  <!-- Side Mirrors -->
  <g id="truck-mirrors" fill="#f59e0b" stroke="#0f172a" stroke-width="0.8">
    <path d="M 5 22 L -2 19 C -3 21 -3 24 -2 26 L 5 25 Z"/>
    <path d="M 49 22 L 56 19 C 57 21 57 24 56 26 L 49 25 Z"/>
  </g>

  <!-- Dual Vertical Chrome Exhaust Stacks -->
  <rect x="3" y="32" width="3.5" height="12" rx="1.5" fill="url(#chrome-grad)" stroke="#334155" stroke-width="0.6"/>
  <rect x="47.5" y="32" width="3.5" height="12" rx="1.5" fill="url(#chrome-grad)" stroke="#334155" stroke-width="0.6"/>

  <g filter="url(#truck-shadow)">
    <!-- 1. TRACTOR CAB -->
    <path d="M 12 4 
             C 19 2, 35 2, 42 4 
             C 46 6, 47 11, 47 18 
             L 47 42 
             C 47 44, 45 45, 41 45 
             L 13 45 
             C 9 45, 7 44, 7 42 
             L 7 18 
             C 7 11, 8 6, 12 4 Z" 
          fill="url(#cab-grad)" 
          stroke="#78350f" 
          stroke-width="1.3"/>

    <!-- Massive Chrome Front Bumper -->
    <path d="M 10 3 Q 27 1 44 3" stroke="url(#chrome-grad)" stroke-width="2.5" fill="none"/>

    <!-- Chrome Heavy Radiator Grille -->
    <rect x="16" y="4" width="22" height="7" rx="1.5" fill="#1e293b" stroke="url(#chrome-grad)" stroke-width="1"/>
    <line x1="18" y1="6" x2="36" y2="6" stroke="#ffffff" stroke-width="0.7"/>
    <line x1="18" y1="8" x2="36" y2="8" stroke="#ffffff" stroke-width="0.7"/>

    <!-- Headlights -->
    <rect x="8" y="5" width="6" height="4" rx="1" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="11" cy="7" r="1.5" fill="#38bdf8"/>
    <rect x="40" y="5" width="6" height="4" rx="1" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="43" cy="7" r="1.5" fill="#38bdf8"/>

    <!-- Hood Center Chrome Spine -->
    <line x1="27" y1="5" x2="27" y2="21" stroke="url(#chrome-grad)" stroke-width="1"/>

    <!-- Cab Windshield -->
    <path d="M 10 20 
             C 17 18, 37 18, 44 20 
             C 45 21, 45 28, 44 30 
             C 37 31, 17 31, 10 30 
             C 9 28, 9 21, 10 20 Z" 
          fill="#0f172a" 
          stroke="#334155" 
          stroke-width="1"/>
    <line x1="16" y1="20" x2="23" y2="26" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="31" y1="20" x2="38" y2="26" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- 5 Amber Cab-Roof Clearance Lights -->
    <circle cx="15" cy="18" r="0.9" fill="#facc15"/>
    <circle cx="21" cy="17" r="0.9" fill="#facc15"/>
    <circle cx="27" cy="16.5" r="0.9" fill="#facc15"/>
    <circle cx="33" cy="17" r="0.9" fill="#facc15"/>
    <circle cx="39" cy="18" r="0.9" fill="#facc15"/>

    <!-- Dual Chrome Air Horns on Cab Roof -->
    <rect x="18" y="24" width="2" height="6" rx="0.5" fill="url(#chrome-grad)"/>
    <rect x="34" y="24" width="2" height="6" rx="0.5" fill="url(#chrome-grad)"/>

    <!-- Fifth-Wheel Articulation Hitch Pivot -->
    <rect x="23" y="44" width="8" height="5" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="0.8"/>
    <circle cx="27" cy="46.5" r="1.8" fill="#475569"/>

    <!-- 2. HEAVY CARGO CONTAINER TRAILER -->
    <!-- Main Trailer Body -->
    <rect x="6" y="49" width="42" height="114" rx="2" fill="url(#container-roof)" stroke="#1e293b" stroke-width="1.4"/>

    <!-- Corrugated Metal Ribbed Roof (18 realistic shadow & highlight ribs) -->
    <g stroke-linecap="round">
      <line x1="7" y1="56" x2="47" y2="56" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="57" x2="47" y2="57" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="62" x2="47" y2="62" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="63" x2="47" y2="63" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="68" x2="47" y2="68" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="69" x2="47" y2="69" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="74" x2="47" y2="74" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="75" x2="47" y2="75" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="80" x2="47" y2="80" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="81" x2="47" y2="81" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="86" x2="47" y2="86" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="87" x2="47" y2="87" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="92" x2="47" y2="92" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="93" x2="47" y2="93" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="98" x2="47" y2="98" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="99" x2="47" y2="99" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="104" x2="47" y2="104" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="105" x2="47" y2="105" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="110" x2="47" y2="110" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="111" x2="47" y2="111" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="116" x2="47" y2="116" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="117" x2="47" y2="117" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="122" x2="47" y2="122" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="123" x2="47" y2="123" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="128" x2="47" y2="128" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="129" x2="47" y2="129" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="134" x2="47" y2="134" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="135" x2="47" y2="135" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="140" x2="47" y2="140" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="141" x2="47" y2="141" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="146" x2="47" y2="146" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="147" x2="47" y2="147" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="7" y1="152" x2="47" y2="152" stroke="#94a3b8" stroke-width="0.9"/>
      <line x1="7" y1="153" x2="47" y2="153" stroke="#1e293b" stroke-width="0.9"/>
    </g>

    <!-- Rear Container Double Swing Doors -->
    <line x1="27" y1="157" x2="27" y2="163" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Vertical Chrome Locking Cam Rods -->
    <line x1="17" y1="156" x2="17" y2="163" stroke="url(#chrome-grad)" stroke-width="1.2"/>
    <line x1="37" y1="156" x2="37" y2="163" stroke="url(#chrome-grad)" stroke-width="1.2"/>

    <!-- DOT-C2 Conspicuity Safety Reflective Stripes (Red/White safety tape) -->
    <g>
      <rect x="7" y="161" width="4" height="2" fill="#ef4444"/>
      <rect x="11" y="161" width="4" height="2" fill="#ffffff"/>
      <rect x="15" y="161" width="4" height="2" fill="#ef4444"/>
      <rect x="19" y="161" width="4" height="2" fill="#ffffff"/>
      <rect x="23" y="161" width="4" height="2" fill="#ef4444"/>
      <rect x="27" y="161" width="4" height="2" fill="#ffffff"/>
      <rect x="31" y="161" width="4" height="2" fill="#ef4444"/>
      <rect x="35" y="161" width="4" height="2" fill="#ffffff"/>
      <rect x="39" y="161" width="4" height="2" fill="#ef4444"/>
      <rect x="43" y="161" width="4" height="2" fill="#ffffff"/>
    </g>

    <!-- Heavy Rubber Mudflaps with Red Reflectors -->
    <rect x="5" y="163" width="7" height="3" fill="#0f172a"/>
    <rect x="7" y="164" width="3" height="1" fill="#ef4444"/>
    <rect x="42" y="163" width="7" height="3" fill="#0f172a"/>
    <rect x="44" y="164" width="3" height="1" fill="#ef4444"/>
  </g>
</svg>
